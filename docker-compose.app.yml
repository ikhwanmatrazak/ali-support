version: "3.9"

# ── Application compose ────────────────────────────────────────────────────
# Deploy this AFTER docker-compose.db.yml.
# Joins the ali_db_net network created by the DB compose.
# Backend reaches MariaDB at hostname: ali_mariadb

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ali_backend
    restart: always
    environment:
      DB_HOST: ali_mariadb
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      WHATSAPP_BRIDGE_URL: http://ali_wa_bridge:3001
      WHATSAPP_BRIDGE_SECRET: ${WHATSAPP_BRIDGE_SECRET}
      BRIDGE_SECRET: ${BRIDGE_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL}
    volumes:
      - media_data:/app/media
    networks:
      - ali_db_net    # reaches MariaDB
      - ali_app_net   # internal app traffic
    depends_on:
      - whatsapp-bridge

  whatsapp-bridge:
    build:
      context: ./whatsapp-bridge
      dockerfile: Dockerfile
    container_name: ali_wa_bridge
    restart: always
    environment:
      BRIDGE_PORT: ${BRIDGE_PORT:-3001}
      BRIDGE_SECRET: ${BRIDGE_SECRET}
      BACKEND_WEBHOOK_URL: http://ali_backend:8000/webhook/whatsapp/incoming
    volumes:
      - wa_sessions:/app/sessions
      - media_data:/app/media
    networks:
      - ali_app_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* must be baked in at build time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    container_name: ali_frontend
    restart: always
    networks:
      - ali_app_net

  nginx:
    image: nginx:alpine
    container_name: ali_nginx
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ali-support.entrypoints=websecure"
      - "traefik.http.routers.ali-support.rule=Host(`ali-support.lightningcloud.my`)"
      - "traefik.http.routers.ali-support.tls.certresolver=letsencrypt"
      - "traefik.http.services.ali-support.loadbalancer.server.port=80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/var/www/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - ali_app_net
      - dokploy-network

volumes:
  wa_sessions:
  media_data:

networks:
  # Shared with DB compose — must exist before this compose starts
  ali_db_net:
    name: ali_db_net
    external: true
  # Internal network for app services only
  ali_app_net:
    driver: bridge
  # Traefik's network — nginx must join so Traefik can route to it
  dokploy-network:
    name: dokploy-network
    external: true
