version: "3.9"

# ── Database-only compose ──────────────────────────────────────────────────
# Deploy this FIRST in Dokploy.
# It creates the shared network ali_db_net that the app compose joins.

services:
  mariadb:
    image: mariadb:11
    container_name: ali_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - ali_db_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:

networks:
  ali_db_net:
    name: ali_db_net
    driver: bridge
